name: GitHub CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  datasets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dataset and manufactured-source test dependencies
        run: python3 -m pip install numpy sympy
      - name: Test hepatic segmentation imports
        run: |
          python3 -m pip install -r tools/hepatic/requirements.txt
          python3 -m unittest discover -s tests -p test_hepatic_tools.py -v
      - name: Test svVascularize SI conversion
        run: |
          python3 -m unittest discover -s tests -p test_svv_conversion.py -v
          python3 -m unittest discover -s tests -p test_svv_boundary_ids.py -v
      - name: Test complete ADAN reconstruction
        run: python3 -m unittest discover -s tests -p test_adan_complete.py -v
      - name: Test full arterial-venous ADAVN model and cycle analysis
        run: python3 -m unittest discover -s tests -p 'test_adavn*.py' -v
      - name: Test ADAN56 reference areas
        run: python3 -m unittest discover -s tests -p test_adan56_areas.py -v
      - name: Check file and directory naming
        run: python3 -m unittest discover -s tests -p test_path_names.py -v
      - name: Test release dataset downloader
        run: python3 -m unittest discover -s tests -p test_download_datasets.py -v
      - name: Test assembly comparison tools
        run: python3 -m unittest discover -s tests -p test_assembly_comparison.py -v
      - name: Test solver-weighted inflow comparison
        run: python3 -m unittest discover -s tests -p test_inflow_trajectory_comparison.py -v
      - name: Test startup ramp comparison tools
        run: python3 -m unittest discover -s tests -p test_late_ramp_outputs.py -v
      - name: Test manufactured sources
        run: python3 -m unittest discover -s tests -p test_mms_tools.py -v
      - name: Test canonical paper runner
        run: |
          python3 -m unittest discover -s tests -p test_paper_runner.py -v
          python3 -m unittest discover -s tests -p test_paper_collection.py -v

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release, DebugRelease]
        backend: [PETSc, Trilinos]
    container:
      image: dealii/dealii:v9.7.1-noble
      options: --user root

    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMETRIC_FLOW_X_BACKEND=${{ matrix.backend }}
          cmake --build build -j 2
          cmake --build build --target adavn_mean_flow -j 2
          ctest --test-dir build -N
          ctest --test-dir build --no-tests=error --output-on-failure
          python3 tests/test_inflow_integration.py --executable build/blood_flow --mpi
          python3 tests/test_initialization_mpi.py --build-dir build
          python3 tests/test_wall_integration.py --executable build/blood_flow --mpi
          python3 tests/test_iterative_bifurcation.py --executable build/blood_flow
          python3 tests/test_iterative_adan.py --executable build/blood_flow
          python3 tests/test_output_schedule.py --executable build/blood_flow
          python3 tests/test_ida_work_limit.py --executable build/blood_flow
          python3 tests/test_stationary_modes.py --executable build/blood_flow --mpi
          python3 tests/test_ida_progress.py --executable build/blood_flow
          python3 tests/test_csv_filenames.py --executable build/blood_flow
      - name: Check dual-variant installation and downstream consumers
        if: matrix.build_type == 'DebugRelease'
        run: |
          cmake --install build --prefix "$PWD/install"
          # Move the prefix to catch non-relocatable package paths.
          mv install relocated
          for variant in Debug Release; do
            cmake -S tools/package_smoke -B "consumer-$variant" -GNinja \
              -DMETRIC_FLOW_X_EXPECT_BACKEND=${{ matrix.backend }} \
              -DCMAKE_BUILD_TYPE="$variant" -DCMAKE_PREFIX_PATH="$PWD/relocated"
            cmake --build "consumer-$variant" -j 2
            ctest --test-dir "consumer-$variant" --no-tests=error --output-on-failure
          done
