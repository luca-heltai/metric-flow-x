name: GitHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  datasets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test release dataset downloader
        run: python3 -m unittest discover -s tests -p test_download_datasets.py -v

  debug:
    runs-on: ubuntu-latest
    container:
      image: dealii/dealii:v9.7.1-noble
      options: --user root

    steps:
      - uses: actions/checkout@v2
      - name: Test debug
        run: |
          rm -rf build_linux_debug
          mkdir build_linux_debug
          cd build_linux_debug
          cmake .. -GNinja -DCMAKE_BUILD_TYPE=Debug
          ninja
          ctest -N
          ctest --output-on-failure

  release:
    runs-on: ubuntu-latest
    container:
      image: dealii/dealii:v9.7.1-noble
      options: --user root

    steps:
      - uses: actions/checkout@v2
      - name: Test release
        run: |
          rm -rf build_linux_release
          mkdir build_linux_release
          cd build_linux_release
          cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release
          ninja
          ctest -N
          ctest --output-on-failure
